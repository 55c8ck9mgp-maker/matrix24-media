name: MATRIX 24 Lite Editorial Research

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  models: read

concurrency:
  group: matrix24-lite-editorial
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Research and verify international news
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/editorial-engine-v2.mjs

      - name: Production boundary
        run: |
          echo "MATRIX24 Lite research complete."
          echo "Legacy Intake/Promotion/Queue admission is disabled in this workflow."
          echo "Publication is allowed only through the Lite preflight -> Metricool path."

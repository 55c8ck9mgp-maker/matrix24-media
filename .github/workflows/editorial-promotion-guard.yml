name: Editorial promotion guard

on:
  pull_request:
    paths:
      - "editorial/promotions/**"
      - "editorial/verified/**"
      - "queue/**"
      - "scripts/build-editorial-promotion.mjs"
      - "scripts/validate-editorial-intake.mjs"
      - "scripts/validate-provenance-reconciliation.mjs"
      - "tests/editorial-promotion.test.mjs"
      - "tests/provenance-reconciliation.test.mjs"
      - ".github/workflows/editorial-promotion-guard.yml"

permissions:
  contents: read

jobs:
  validate-promotion:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Validate regressions
        run: node --test tests/editorial-intake.test.mjs tests/editorial-promotion.test.mjs tests/provenance-reconciliation.test.mjs
      - name: Guard queue writes
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.sha }}
        run: |
          queues="$(git diff --name-only "$BASE_REF" "$HEAD_REF" | grep '^queue/.*\.json$' || true)"
          if [ -z "$queues" ]; then exit 0; fi
          count="$(printf '%s\n' "$queues" | sed '/^$/d' | wc -l)"
          [ "$count" -eq 1 ] || { echo "provenance reconciliation rejected: exactly one queue file may change"; exit 1; }
          queue="$queues"
          id="$(basename "$queue" .json)"
          draft="editorial/verified/$id.json"
          manifest="editorial/promotions/$id.json"
          git show "$BASE_REF:$queue" > /tmp/queue-before.json
          node scripts/validate-provenance-reconciliation.mjs /tmp/queue-before.json "$queue" "$draft" "$manifest" queue/*.json

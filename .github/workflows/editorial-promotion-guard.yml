name: Editorial promotion guard

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - 'queue/*.json'
  repository_dispatch:
    types: [editorial_promotion_guard]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Trusted main SHA
        required: true
        type: string
      head_sha:
        description: Promotion PR head SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-promotion:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      BASE_REF: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || (github.event_name == 'repository_dispatch' && github.event.client_payload.base_sha || inputs.base_sha) }}
      HEAD_REF: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || (github.event_name == 'repository_dispatch' && github.event.client_payload.head_sha || inputs.head_sha) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.head_sha || inputs.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Validate trusted dispatch inputs
        run: |
          git cat-file -e "$BASE_REF^{commit}"
          git cat-file -e "$HEAD_REF^{commit}"
          git merge-base --is-ancestor "$BASE_REF" "$HEAD_REF" || { echo "promotion guard rejected: base is not an ancestor of head"; exit 1; }
      - name: Validate regressions
        run: node --test tests/editorial-intake.test.mjs tests/editorial-promotion.test.mjs tests/provenance-reconciliation.test.mjs tests/matrix24-health.test.mjs
      - name: Validate Promotion Controller workflow invariants
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('.github/workflows/editorial-queue-promotion.yml','utf8');
          const required=[
            'pull-requests: write',
            'group: editorial-queue-promotion',
            'git push origin "$branch"',
            'multiple open promotion PRs exist for $CONTENT_ID',
            'branch="promotion/${CONTENT_ID}"',
            'gh pr list --state open --base main --head "$PROMOTION_BRANCH"',
            'if [ "$existing" -gt 1 ]',
            'if [ "$existing" -eq 1 ]',
            'gh pr create',
            '--base main',
            '--head "$PROMOTION_BRANCH"',
            '--body-file pr-body.md',
            'editorial_promotion_guard',
            '/dispatches'
          ];
          for (const token of required) {
            if (!s.includes(token)) throw new Error('promotion controller invariant missing: '+token);
          }
          if (/gh pr merge|--merge|--squash|--rebase/.test(s)) throw new Error('promotion controller must not auto-merge');
          console.log('Promotion Controller workflow invariants validated');
          NODE
      - name: Guard queue writes
        run: |
          queues="$(git diff --name-only "$BASE_REF" "$HEAD_REF" | grep '^queue/.*\.json$' || true)"
          if [ -z "$queues" ]; then exit 0; fi
          count="$(printf '%s\n' "$queues" | sed '/^$/d' | wc -l)"
          [ "$count" -eq 1 ] || { echo "editorial queue promotion rejected: exactly one queue file may change"; exit 1; }
          queue="$queues"
          git cat-file -e "$BASE_REF:$queue" 2>/dev/null && { echo "editorial queue promotion rejected: queue record already exists on trusted main"; exit 1; } || true
          git show "$HEAD_REF:$queue" > /tmp/promotion-candidate.json
          git checkout --detach "$BASE_REF"
          node scripts/validate-editorial-queue-promotion.mjs "$queue" /tmp/promotion-candidate.json

name: Publication reservation (LEGACY — disabled)

# Core v2 cutover 2026-09-29.
# Durable publication claims are owned exclusively by ChatGPT Publisher as part
# of ready_to_publish -> publishing. This legacy workflow intentionally has no
# schedule, no dispatch trigger and no write permission. Kept only as an
# auditable tombstone so the former reservation path cannot be reactivated by
# an accidental manual dispatch.

on:
  push:
    branches:
      - __matrix24_legacy_disabled__

permissions:
  contents: read

jobs:
  disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "LEGACY_RESERVATION_DISABLED_BY_CORE_V2"

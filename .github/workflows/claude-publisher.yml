name: Claude Publisher (LEGACY — read-only plan)

# Core v2 cutover 2026-09-29.
# ChatGPT Publisher is the sole owner of ready_to_publish -> publishing.
# This legacy workflow is permanently fail-closed for publication: it has no
# publish job, no Instagram publish token, no contents:write permission and no
# workflow_dispatch publish mode. It may only produce a read-only diagnostic plan.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Legacy diagnostic plan only
        env:
          OPEN_REQUEST_ISSUES: 'false'
        run: |
          node scripts/claude-publisher.mjs plan > publisher-plan.json
          cat publisher-plan.json
      - name: Enforce Core v2 publication boundary
        run: |
          echo "LEGACY_PUBLISH_DISABLED: assistant/chatgpt-publisher is the sole Core v2 Publisher"

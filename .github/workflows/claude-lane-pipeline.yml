name: Claude Lane Pipeline

# docs/CLAUDE_LANE.md. Every 4 hours: reconcile -> produce one bilingual story ->
# publish one story. Drafts come from Claude's research task on branch
# claude/lane-drafts (claude-lane/drafts/*.json). Commits and Instagram publication happen ONLY when the
# repository variable CLAUDE_LANE_ENABLED is exactly "true" (set by Justen).
# Otherwise the run is a dry run and the draft + card are uploaded as an artifact.
# Writes are limited to claude-lane/ by scripts/claude-lane/git-store.mjs.
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: claude-lane
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ig_media_id:    ${{ steps.lane-publish-result.outputs.ig_media_id }}
      content_id:     ${{ steps.lane-publish-result.outputs.content_id }}
      card_image_url: ${{ steps.lane-publish-result.outputs.card_image_url }}
      caption_en:     ${{ steps.lane-publish-result.outputs.caption_en }}
      hashtags:       ${{ steps.lane-publish-result.outputs.hashtags }}
      headline_es:    ${{ steps.lane-publish-result.outputs.headline_es }}
      summary_es:     ${{ steps.lane-publish-result.outputs.summary_es }}
      headline_en:    ${{ steps.lane-publish-result.outputs.headline_en }}
      summary_en:     ${{ steps.lane-publish-result.outputs.summary_en }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 20
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Renderer dependencies
        run: |
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core >/dev/null
          python3 -m pip install --quiet 'pillow==12.*'
      - name: Card v2 dependencies (HTML template, map, Chromium)
        # Normally ~25 s. On 2026-10-22 22:50 UTC it took 9.5 min and the job
        # timeout cancelled "Run lane" right after rendering. Cap it so a slow
        # install falls back to the v1 card and never eats the publish budget.
        continue-on-error: true
        timeout-minutes: 4
        run: |
          cd claude-lane/render && npm install --no-audit --no-fund --silent
          npx playwright install --with-deps chromium >/dev/null
      - name: Run lane
        env:
          CLAUDE_LANE_ENABLED: ${{ vars.CLAUDE_LANE_ENABLED }}
          IG_CLAUDE_ACCESS_TOKEN: ${{ secrets.IG_CLAUDE_ACCESS_TOKEN }}
          IG_CLAUDE_USER_ID: '17841423605720355'
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
          CF_ACCOUNT_ID: e2776b03d0f07550fa6d0bbe80f87dbe
          GITHUB_TOKEN: ${{ github.token }}
          LANE_OUT: ${{ runner.temp }}/lane-out
        run: |
          mkdir -p "$LANE_OUT"
          git config user.name matrix24-claude-lane
          git config user.email matrix24-claude-lane@users.noreply.github.com
          node scripts/claude-lane/run-lane.mjs
      - name: Surface publish result for Reel job
        id: lane-publish-result
        if: vars.CLAUDE_LANE_ENABLED == 'true'
        run: |
          node --input-type=commonjs << 'JSEOF'
          const { execSync } = require('child_process');
          const fs = require('fs');
          let changedFile = '';
          try {
            changedFile = execSync(
              "git log --author='matrix24-claude-lane' --format='' --diff-filter=M --name-only -1 --since='10 minutes ago' -- 'claude-lane/queue/*.json'",
              { encoding: 'utf8', stdio: ['ignore', 'pipe', 'ignore'] }
            ).split('\n').filter(Boolean)[0] || '';
          } catch {}
          let output = 'ig_media_id=\n';
          if (changedFile) {
            try {
              const r = JSON.parse(fs.readFileSync(changedFile, 'utf8'));
              if (r.status === 'published' && r.ig_media_id) {
                output = [
                  `ig_media_id=${r.ig_media_id}`,
                  `content_id=${r.content_id || ''}`,
                  `card_image_url=${r.image_url || ''}`,
                  `caption_en=${(r.caption_en || '').replace(/[\n\r]/g, ' ').slice(0, 500)}`,
                  `hashtags=${JSON.stringify(r.hashtags || [])}`,
                  `headline_es=${(r.headline_es || '').replace(/[\n\r]/g, ' ')}`,
                  `summary_es=${(r.summary_es || '').replace(/[\n\r]/g, ' ')}`,
                  `headline_en=${(r.headline || r.headline_en || '').replace(/[\n\r]/g, ' ')}`,
                  `summary_en=${(r.summary_en || '').replace(/[\n\r]/g, ' ')}`,
                ].join('\n') + '\n';
              }
            } catch (e) {
              process.stderr.write('lane-publish-result: ' + e.message + '\n');
            }
          }
          const ghOut = process.env.GITHUB_OUTPUT;
          if (ghOut) fs.appendFileSync(ghOut, output);
          JSEOF
      - name: Upload dry-run preview
        if: always() && vars.CLAUDE_LANE_ENABLED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: claude-lane-preview
          path: ${{ runner.temp }}/lane-out
          if-no-files-found: ignore

  publish-reel:
    needs: pipeline
    if: >-
      needs.pipeline.result == 'success' &&
      needs.pipeline.outputs.ig_media_id != '' &&
      needs.pipeline.outputs.ig_media_id != 'dry_run'
    # No continue-on-error here: GitHub rejects it on a job that calls a
    # reusable workflow, which invalidated this whole file and stopped every
    # scheduled carousel run (watchdog 2026-11-10). The carousel is already
    # committed by the pipeline job before this job starts, so a Reel failure
    # only marks the run red; it cannot undo or block the carousel.
    uses: ./.github/workflows/claude-lane-reels.yml
    with:
      content_id:     ${{ needs.pipeline.outputs.content_id }}
      card_image_url: ${{ needs.pipeline.outputs.card_image_url }}
      caption_en:     ${{ needs.pipeline.outputs.caption_en }}
      hashtags:       ${{ needs.pipeline.outputs.hashtags }}
      headline_es:    ${{ needs.pipeline.outputs.headline_es }}
      summary_es:     ${{ needs.pipeline.outputs.summary_es }}
      headline_en:    ${{ needs.pipeline.outputs.headline_en }}
      summary_en:     ${{ needs.pipeline.outputs.summary_en }}
      dry_run:        false
    secrets:
      IG_CLAUDE_ACCESS_TOKEN: ${{ secrets.IG_CLAUDE_ACCESS_TOKEN }}

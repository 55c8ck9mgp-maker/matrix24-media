name: Production state invariant audit

on:
  pull_request:
    paths:
      - 'queue/*.json'
      - 'editorial/verified/*.json'
      - 'editorial/promotions/*.json'
      - 'scripts/audit-production-state.mjs'
      - 'scripts/queue-transition-ownership.mjs'
      - 'scripts/select-promotion-work.mjs'
      - 'scripts/classify-matrix24-health.mjs'
      - 'tests/production-state-audit.test.mjs'
      - 'scripts/audit-stalled-promotion-prs.mjs'
      - 'tests/stalled-promotion-prs.test.mjs'
      - 'tests/promotion-work-selection.test.mjs'
      - 'tests/promotion-controller-trigger.test.mjs'
      - 'tests/matrix24-health.test.mjs'
      - '.github/workflows/editorial-queue-promotion.yml'
      - '.github/workflows/editorial-intake.yml'
      - '.github/workflows/editorial-promotion-guard.yml'
      - '.github/workflows/production-state-audit.yml'
  push:
    branches:
      - main
    paths:
      - 'queue/*.json'
      - 'editorial/verified/*.json'
      - 'editorial/promotions/*.json'
      - 'scripts/audit-production-state.mjs'
      - 'scripts/queue-transition-ownership.mjs'
      - 'scripts/select-promotion-work.mjs'
      - 'scripts/classify-matrix24-health.mjs'
      - 'tests/production-state-audit.test.mjs'
      - 'scripts/audit-stalled-promotion-prs.mjs'
      - 'tests/stalled-promotion-prs.test.mjs'
      - 'tests/promotion-work-selection.test.mjs'
      - 'tests/promotion-controller-trigger.test.mjs'
      - 'tests/matrix24-health.test.mjs'
      - '.github/workflows/editorial-queue-promotion.yml'
      - '.github/workflows/editorial-intake.yml'
      - '.github/workflows/editorial-promotion-guard.yml'
      - '.github/workflows/production-state-audit.yml'
  schedule:
    - cron: '7 * * * *'
  repository_dispatch:
    types: [promotion_validation]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: production-state-invariant-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.head_sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Run stability contract tests
        run: |
          node --test \
            tests/production-state-audit.test.mjs \
            tests/queue-transition-ownership.test.mjs \
            tests/core-v2-ownership-compat.test.mjs \
            tests/promotion-work-selection.test.mjs \
            tests/promotion-controller-trigger.test.mjs \
            tests/matrix24-health.test.mjs \
            tests/stalled-promotion-prs.test.mjs
      - name: Audit current durable production state
        run: node scripts/audit-production-state.mjs
      # Observation only. Approved promotion PRs are never merged by automation,
      # so a PR left open is a silent stall that queue/ state cannot show.
      - name: Warn about approved promotions waiting for merge
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROMOTION_STALL_HOURS: '4'
        run: node scripts/audit-stalled-promotion-prs.mjs

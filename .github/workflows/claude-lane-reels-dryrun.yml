name: Claude Lane Reels dry run (no publishing)

# Renders one test Reel from a published card and the news-style audio bed,
# then checks it with ffprobe. It never uploads or publishes anything. Manual
# runs only. See scripts/claude-lane/reel-render.mjs and docs/CLAUDE_LANE.md.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          sparse-checkout: |
            claude-lane/media
            scripts/claude-lane
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Render test Reel and verify
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reels"
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "sine=frequency=880:duration=0.25" -f lavfi -i "aevalsrc=0.02*(random(0)*2-1):d=15" -filter_complex "[0:a]volume=0.4,apad=whole_dur=15[sting];[1:a]lowpass=f=900,volume=0.5[bed];[sting][bed]amix=inputs=2:duration=first:normalize=0,afade=t=out:st=13:d=2" -ac 2 -ar 44100 -c:a aac -b:a 128k "$RUNNER_TEMP/reels/bed.m4a"
          CARD=$(ls claude-lane/media/*.jpg | tail -1)
          ARGS=$(node -e "import('./scripts/claude-lane/reel-render.mjs').then(m=>{const r=m.buildReelArgs({image:process.argv[1],audio:process.argv[2],out:process.argv[3],seconds:15});if(!r.ok)throw new Error(r.reason);process.stdout.write(JSON.stringify(r.args))})" "$CARD" "$RUNNER_TEMP/reels/bed.m4a" "$RUNNER_TEMP/reels/reel.mp4")
          node -e "const a=JSON.parse(process.argv[1]);require('child_process').execFileSync('ffmpeg',a,{stdio:'inherit'})" "$ARGS"
          ffprobe -v error -show_entries stream=codec_type,width,height -show_entries format=duration -of compact "$RUNNER_TEMP/reels/reel.mp4" | tee -a "$GITHUB_STEP_SUMMARY"

name: Deploy Publication v2 private staging

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: publication-v2-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Safety contract
        run: node --test tests/publication-v2-private-runtime.test.mjs
      - name: Dry run private runtime
        run: npx --yes wrangler@4.139.0 deploy --dry-run --config publisher-v2/private-runtime/wrangler.jsonc
      - name: Deploy disabled private runtime
        run: npx --yes wrangler@4.139.0 deploy --keep-vars --config publisher-v2/private-runtime/wrangler.jsonc

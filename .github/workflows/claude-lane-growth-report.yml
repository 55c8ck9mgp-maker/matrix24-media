name: Claude Lane growth report (read-only)

# Weekly read-only growth observer for @matrix24global (docs/CLAUDE_LANE.md
# "Growth observer"). Only GET requests to the Instagram Graph API. It never
# publishes, writes to the queue or repository, or changes any setting. The
# report goes to the job summary.
on:
  schedule:
    - cron: '17 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          sparse-checkout: |
            scripts/claude-lane
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Growth report
        env:
          IG_CLAUDE_ACCESS_TOKEN: ${{ secrets.IG_CLAUDE_ACCESS_TOKEN }}
        run: node scripts/claude-lane/growth-report.mjs

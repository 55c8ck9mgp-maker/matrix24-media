name: Claude Lane models probe (branch only)
on:
  push:
    branches: [claude/lane-models-probe]
permissions:
  contents: read
  models: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          c=$(curl -sS -w ' HTTP=%{http_code}' -H "Authorization: Bearer $GITHUB_TOKEN" https://models.github.ai/catalog/models | tr -d '\r\n' | cut -c1-300)
          echo "::notice title=catalog::$c"
          for m in openai/gpt-4.1 openai/gpt-4o-mini; do
            out=$(curl -sS -i -X POST -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: application/json" -H "Authorization: Bearer $GITHUB_TOKEN" https://models.github.ai/inference/chat/completions -d "{\"model\":\"$m\",\"messages\":[{\"role\":\"user\",\"content\":\"Say hi\"}]}" | tr -d '\r' | tr '\n' '|' | cut -c1-700)
            echo "::notice title=$m::$out"
          done
          o=$(curl -sS -w ' HTTP=%{http_code}' -X POST -H "Content-Type: application/json" -H "Authorization: Bearer $GITHUB_TOKEN" "https://models.github.ai/orgs/${GITHUB_REPOSITORY_OWNER}/inference/chat/completions" -d '{"model":"openai/gpt-4o-mini","messages":[{"role":"user","content":"Say hi"}]}' | tr -d '\r\n' | cut -c1-300)
          echo "::notice title=org-variant::$o"

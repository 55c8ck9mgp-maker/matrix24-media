name: Deploy Worker to production

# Manual trigger only. Deploys a specific released Worker version to the
# matrix24-publisher production worker on Cloudflare Workers.
#
# This workflow requires:
# - CLOUDFLARE_API_TOKEN secret (configured in GitHub org or repo settings)
# - An approved released version in worker/releases/vX.Y.Z/
#
# Rollback: `git revert` the release commit and re-run this workflow with the
# prior version number, or use Cloudflare Dashboard to roll back the Worker.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Worker version to deploy (e.g., v3.2.1, v3.3.0)'
        required: true
        type: string
      dry_run:
        description: 'Perform a dry run (no actual deploy)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER_VERSION: ${{ inputs.version }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Validate version directory exists
        run: |
          if [ ! -d "worker/releases/${WORKER_VERSION}" ]; then
            echo "::error::Worker version directory not found: worker/releases/${WORKER_VERSION}"
            exit 1
          fi
          echo "Deploying version: ${WORKER_VERSION}"

      - name: List deployment artifacts
        run: ls -la "worker/releases/${WORKER_VERSION}/"

      - name: Dry run
        if: env.DRY_RUN == 'true'
        run: |
          cd "worker/releases/${WORKER_VERSION}"
          npx --yes wrangler@4.139.0 deploy --dry-run

      - name: Production deploy (keep vars and secrets)
        if: env.DRY_RUN == 'false'
        run: |
          cd "worker/releases/${WORKER_VERSION}"
          echo "::notice::Deploying ${WORKER_VERSION} to matrix24-publisher (production)"
          npx --yes wrangler@4.139.0 deploy --keep-vars

      - name: Verify deployment
        if: env.DRY_RUN == 'false'
        run: |
          echo "Deployment of ${WORKER_VERSION} complete."
          echo "Verify via: curl -s https://matrix24-publisher.55c8ck9mgp-maker.workers.dev/health"

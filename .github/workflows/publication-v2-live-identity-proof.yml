name: Publication v2 live identity proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    environment: publication-v2-staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Wrangler for proof runner
        run: npm install --no-save --ignore-scripts wrangler@4.145.0
      - name: Run read-only remote identity proof
        run: node publisher-v2/identity-proof/run.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

name: Publication v2 private preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: publication-v2-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Verify private runtime remains fail-closed
        run: node --test tests/publication-v2-private-runtime.test.mjs
      - name: Verify Worker GitHub App bindings without exposing values
        shell: bash
        run: |
          set -euo pipefail
          secrets="$(npx --yes wrangler@4.139.0 secret list --config publisher-v2/private-runtime/wrangler.jsonc)"
          config="$(cat publisher-v2/private-runtime/wrangler.jsonc)"
          node -e '
            const secrets=process.argv[1];
            const config=process.argv[2];
            const checks=[
              ["GITHUB_APP_ID",config.includes("\\\"GITHUB_APP_ID\\\"")],
              ["GITHUB_INSTALLATION_ID",config.includes("\\\"GITHUB_INSTALLATION_ID\\\"")],
              ["GITHUB_APP_PRIVATE_KEY",secrets.includes("GITHUB_APP_PRIVATE_KEY")]
            ];
            console.log("Required GitHub App bindings:",checks.map(([name,ok])=>name+":"+(ok?"present":"missing")).join(", "));
            const missing=checks.filter(([,ok])=>!ok).map(([name])=>name);
            if(missing.length){ console.error("Missing required bindings:",missing.join(", ")); process.exit(1); }
          ' "$secrets" "$config"
      - name: Confirm activation remains disabled
        run: |
          node -e '
            const fs=require("fs");
            const raw=fs.readFileSync("publisher-v2/private-runtime/wrangler.jsonc","utf8");
            if(!raw.includes("\\"PUBLISHER_V2_ENABLED\\": \\"false\\"")) process.exit(1);
            console.log("PUBLISHER_V2_ENABLED=false");
          '

name: Metricool recovery (DEPRECATED, manual only)

# DEPRECATED 2026-09-29. Its original version created a second Metricool post
# for any record stuck in `publishing`, which is a blind retry and a duplicate
# risk. Phase 1 (50d0c3c) already made it read-only and fail-closed; this change
# also removes its schedule. Stalled attempts are now handled by
# `instagram-reconciliation.yml` (read-only toward Instagram). Kept for one
# release as a manual, read-only detection report; delete after that.

# Automatic recovery for Polo publications stalled in Metricool.
#
# This workflow detects queue records that have been stuck in 'publishing'
# status without receiving an instagram_media_id for >30 minutes. When found,
# it invokes Metricool API as a secondary path (Plan B) to create the Instagram
# post and recover the publication without blocking the queue.
#
# Plan A (primary): Auto Publisher → Metricool API → instagram_media_id
# Plan B (recovery): stalled detection → this workflow → Metricool API
#
# Runs every 5 minutes + manual dispatch for operator control.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan only, do not invoke Metricool or write queue
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # Serialize Metricool recovery to avoid duplicate API calls for the same stalled record
  group: metricool-recovery
  cancel-in-progress: false

jobs:
  detect-and-recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Detect stalled records
        id: detect
        run: |
          node scripts/detect-metricool-stalled.mjs > stalled-plan.json
          cat stalled-plan.json
          count=$(node -e 'const p=require("./stalled-plan.json"); process.stdout.write(String(p.count||0))')
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Reconcile gate (fail closed; no external retry)
        if: steps.detect.outputs.count != '0' && steps.detect.outputs.count != ''
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || false }}
        run: node scripts/invoke-metricool-recovery.mjs stalled-plan.json

      - name: Summary
        if: always()
        run: |
          plan="$(cat stalled-plan.json)"
          count=$(node -e "const p=require('./stalled-plan.json'); console.log(p.count || 0)")
          skipped=$(node -e "const p=require('./stalled-plan.json'); console.log(p.skipped ? p.skipped.length : 0)")
          recovered=$(node -e "const p=require('./stalled-plan.json'); console.log(p.recovered ? p.recovered.length : 0)")
          errors=$(node -e "const p=require('./stalled-plan.json'); console.log(p.errors ? p.errors.length : 0)")

          echo "## Metricool Recovery Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Stalled records detected**: $count" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Records recovered**: $recovered" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Records skipped**: $skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Errors**: $errors" >> "$GITHUB_STEP_SUMMARY"

          if [ "$errors" -gt 0 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Errors" >> "$GITHUB_STEP_SUMMARY"
            node -e "
              const p = require('./stalled-plan.json');
              if (p.errors && p.errors.length > 0) {
                for (const err of p.errors) {
                  console.log(\`- \${err.content_id}: \${err.reason} (\${err.detail || ''})\`);
                }
              }
            " >> "$GITHUB_STEP_SUMMARY"
          fi

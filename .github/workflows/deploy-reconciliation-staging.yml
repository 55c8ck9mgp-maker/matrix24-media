name: Deploy reconciliation staging
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: npx --yes wrangler@4.139.0 deploy --dry-run --config worker/reconciliation-staging/wrangler.jsonc
      - run: npx --yes wrangler@4.139.0 deploy --keep-vars --config worker/reconciliation-staging/wrangler.jsonc
